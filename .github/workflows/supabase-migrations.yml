name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    name: Push migrations + smoke test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'fcrwxuyyixozudwyhkcz' }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # Pinned: CLI 3.0 made `db push` target a local stack unless --remote
      # is passed, which broke this job on 3 Nov 2026.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link to project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Diff (plan)
        run: |
          echo "=== migrations on disk ==="
          ls supabase/migrations | sort
          echo ""
          echo "=== migration list (remote vs local) ==="
          supabase migration list || true

      # We apply flaxhr's own migrations directly instead of `supabase db
      # push`. The Operations database is shared: another product (nerve)
      # writes its own migration versions into the same schema_migrations
      # history, and `db push` aborts whenever it sees versions that aren't in
      # this repo. This step ignores foreign versions — it applies only the
      # files in supabase/migrations whose version isn't already recorded,
      # each atomically (apply + record in one transaction), in order.
      - name: Push (apply pending)
        env:
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          SUPABASE_DB_URL="$(cat supabase/.temp/pooler-url)"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

          applied="$(psql "$SUPABASE_DB_URL" -At -c \
            'select version from supabase_migrations.schema_migrations')"

          any=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            base="$(basename "$f")"
            ver="${base%%_*}"                 # timestamp prefix before first _
            name="${base#*_}"; name="${name%.sql}"
            if grep -qxF "$ver" <<<"$applied"; then
              continue
            fi
            echo "::group::apply $base"
            # -f then -c run in one session; --single-transaction makes the
            # migration and its history row commit together or not at all.
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction \
              -f "$f" \
              -c "insert into supabase_migrations.schema_migrations (version, name)
                  values ('$ver', \$\$${name}\$\$) on conflict (version) do nothing;"
            echo "::endgroup::"
            any=1
          done
          [ "$any" = 1 ] || echo "no pending flaxhr migrations"

      - name: Smoke test — every new table & view exists
        env:
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
        run: |
          # Anything in supabase/tests/*.sql is run as a smoke test against
          # the live DB. Each file should be self-contained and use
          # raise exception on failure so non-zero exit propagates.
          # The pooler host depends on the project's region, so take the URL
          # `supabase link` saved rather than hard-coding one.
          SUPABASE_DB_URL="$(cat supabase/.temp/pooler-url)"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          if [ -d supabase/tests ]; then
            for f in supabase/tests/*.sql; do
              echo "::group::$(basename "$f")"
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
              echo "::endgroup::"
            done
          else
            echo "no smoke tests"
          fi

      - name: Reload PostgREST schema
        run: |
          curl -fsSL -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/rpc/notify_pgrst_reload" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "notify_pgrst_reload RPC missing — non-fatal; reload happens on next request anyway"
